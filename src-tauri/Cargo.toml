[package]
name = "onlyfiles"
version = "0.2.0"
description = "OF OnlyFiles: zeigt, welche Ordner und Dateien den Platz belegen"
authors = ["infralatis"]
license = "MIT"
edition = "2024"

[lib]
name = "onlyfiles_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
